<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lilgatchi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-pet" role="tab" aria-selected="true" aria-controls="panel-pet">Pet</button>
      <button class="tab" id="tab-status" role="tab" aria-selected="false" aria-controls="panel-status">Status</button>
      <button class="tab" id="tab-attributes" role="tab" aria-selected="false" aria-controls="panel-attributes">Attributes</button>
      <button class="tab" id="tab-debug" role="tab" aria-selected="false" aria-controls="panel-debug">Debug</button>
    </div>

    <section class="panel" id="panel-pet" role="tabpanel" aria-labelledby="tab-pet">
      <div class="portrait" id="portrait">
        <img id="critter" alt="Your pet">
        <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
        <div class="badge clock" id="clock" role="img">
          <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="#fffaf2" stroke="#3b3530" stroke-width="2"/>
            <g stroke="#3b3530" stroke-width="2" stroke-linecap="round">
              <line x1="20" y1="4.5" x2="20" y2="7.5"/>
              <line x1="35.5" y1="20" x2="32.5" y2="20"/>
              <line x1="20" y1="35.5" x2="20" y2="32.5"/>
              <line x1="4.5" y1="20" x2="7.5" y2="20"/>
            </g>
            <line id="hand-hour" x1="20" y1="20" x2="20" y2="11" stroke="#3b3530" stroke-width="3" stroke-linecap="round"/>
            <line id="hand-minute" x1="20" y1="20" x2="20" y2="7" stroke="#3b3530" stroke-width="2" stroke-linecap="round"/>
            <line id="hand-second" x1="20" y1="22" x2="20" y2="6.5" stroke="#e4566f" stroke-width="1" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="1.8" fill="#3b3530"/>
          </svg>
        </div>
        <div class="badge mood" id="mood" role="img"></div>
        <div class="floaters" id="floaters" aria-live="polite"></div>
      </div>

      <div class="name">
        <span class="name-text" id="name"></span>
        <span class="heart" aria-hidden="true">&#9829;</span>
      </div>

      <div class="actions three">
        <button class="btn outline" id="travel" disabled title="Coming soon">Travel</button>
        <button class="btn outline" id="play" disabled title="Coming soon">Play</button>
        <button class="btn outline" id="items" disabled title="Coming soon">Items</button>
      </div>
      <div class="actions two">
        <button class="btn" id="feed">Feed</button>
        <button class="btn" id="medicine">Medicine</button>
        <button class="btn" id="train">Train</button>
        <button class="btn" id="lights">Lights off</button>
      </div>
    </section>

    <section class="panel" id="panel-status" role="tabpanel" aria-labelledby="tab-status" hidden>
      <h2 class="panel-title">Status</h2>
      <div class="meters" id="status-meters"></div>
    </section>

    <section class="panel" id="panel-attributes" role="tabpanel" aria-labelledby="tab-attributes" hidden>
      <h2 class="panel-title">Attributes</h2>
      <div class="species-row">
        <span>Species</span>
        <span class="species-value" id="species"></span>
      </div>
      <div class="meters grouped" id="attribute-meters"></div>
    </section>

    <section class="panel debug" id="panel-debug" role="tabpanel" aria-labelledby="tab-debug" hidden>
      <div class="debug-row">
        <span>Hunger every</span>
        <div class="segmented" role="group" aria-label="Hunger pace">
          <button class="seg" id="pace-normal" aria-pressed="true">5 min</button>
          <button class="seg" id="pace-fast" aria-pressed="false">10 sec</button>
        </div>
      </div>
      <div class="debug-row">
        <span>Next hunger drop</span>
        <span class="mono" id="countdown"></span>
      </div>
      <div class="debug-block">
        <div class="debug-row">
          <span>Clock</span>
          <span class="mono" id="clock-readout"></span>
        </div>
        <div class="debug-row">
          <input type="time" id="clock-input" aria-label="Set clock time">
          <button class="small-btn" id="clock-set">Set</button>
        </div>
        <div class="debug-row">
          <span class="hint" id="clock-mode"></span>
          <button class="small-btn" id="clock-system">Use system clock</button>
        </div>
      </div>
      <button class="btn secondary" id="reset">New pet</button>
    </section>

    <section class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
      <h2 class="panel-title" id="picker-title">Choose your pet</h2>
      <div class="picker-options" id="picker-options"></div>
      <p class="hint picker-note" id="picker-note">Your current pet will be replaced.</p>
      <button class="btn secondary" id="picker-cancel">Cancel</button>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/names.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
